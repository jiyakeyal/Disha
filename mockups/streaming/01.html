ss="wrap"><div class="tag">INTERACTIVE PREVIEW · Simulated response</div><div class="user">What can I do after Class 10 if I enjoy maths?</div><div class="answer" aria-live="polite"><div class="brand"><span id="spark" class="spark active">✳</span><span>Disha</span></div><div id="waiting" class="status"><div class="line" id="l1">Looking at your question<span class="dots"></span></div><div class="line" id="l2">Considering your options</div><div class="line" id="l3">Preparing a clear response</div></div><div id="response" hidden></div></div><div class="controls"><button id="replay">Replay preview</button><button id="stop">Stop response</button></div><div class="notice">Preview only. The progress lines are general waiting messages, not a transcript of the model’s private reasoning.</div></div><script>let timers=[],stopped=false;const waiting=document.getElementById('waiting'),response=document.getElementById('response'),spark=document.getElementById('spark'),lines=[1,2,3].map(n=>document.getElementById('l'+n));function later(f,ms){timers.push(setTimeout(f,ms))}function stop(){timers.forEach(clearTimeout);timers=[];stopped=true;spark.classList.remove('active');if(!response.hidden)response.textContent+='\n\nResponse stopped.';else{waiting.innerHTML='<div class="line show">Response stopped.</div>'}}function start(){timers.forEach(clearTimeout);timers=[];stopped=false;waiting.innerHTML='';lines.forEach(x=>{x.className='line';waiting.appendChild(x)});waiting.hidden=false;response.hidden=true;response.textContent='';spark.classList.add('active');lines[0].classList.add('show','current');later(()=>{lines[0].classList.remove('current');lines[1].classList.add('show','current')},1100);later(()=>{lines[1].classList.remove('current');lines[2].classList.add('show','current')},2200);later(()=>{waiting.hidden=true;response.hidden=false;const text='Enjoying maths can open several paths after Class 10.\n\n**Science with maths** can lead toward engineering, technology and research. **Commerce with maths** can be a route into finance, economics or statistics.\n\nWhat parts of maths do you enjoy most?';let i=0;function write(){if(stopped)return;response.textContent=text.slice(0,i+=3);if(i<text.length)later(write,35);else spark.classList.remove('active')}write()},3400)}document.getElementById('replay').onclick=start;document.getElementById('stop').onclick=stop;start()</script></body></html>
