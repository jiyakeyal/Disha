<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disha — Home preview</title><style>
*{box-sizing:border-box}body{margin:0;color:#201812;font-family:system-ui,sans-serif;min-height:100vh;background:radial-gradient(circle at 12% 25%,#ff7629,transparent 45%),radial-gradient(circle at 88% 18%,#c8aff0,transparent 50%),linear-gradient(135deg,#ff9a58,#f4b3a7 50%,#d5b4df);background-attachment:fixed}.shell{max-width:1000px;margin:auto;padding:18px 24px 160px}.header{border:1px solid #fff9;background:#ffffff52;border-radius:40px;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand strong{display:block;font:700 24px Georgia,serif}.brand span{display:block;font-size:11px;letter-spacing:.06em;color:#55483f}.actions{display:flex;gap:8px;align-items:center}.actions button,.ask{border:1px solid #fff9;border-radius:99px;background:#ffffff80;color:#3b2920;padding:9px 15px;font-weight:600}.actions button:disabled{opacity:.5}main{max-width:850px;margin:85px auto 0}h1{font-size:clamp(34px,5vw,52px);line-height:1.09;letter-spacing:-.045em;margin:0 0 16px;max-width:700px}p{margin:0;color:#493a32;font-size:17px;line-height:1.5}.section{margin-top:54px}.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:15px}.section-head h2{margin:0;font-size:17px}.section-head span{font-size:12px;color:#5f514a}.window{overflow:hidden}.track{display:flex;gap:12px;width:max-content;animation:slide 32s linear infinite reverse}.window:hover .track,.window:focus-within .track{animation-play-state:paused}.card{width:calc((min(850px, 100vw - 48px) - 36px)/3.5);aspect-ratio:1 / 1;flex:none;border:1px solid #fffd;background:#ffffff93;border-radius:24px;padding:20px;text-align:left;color:#261e19;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}.card:nth-child(even){background:#ffffffb0}.card b{font-size:16px;line-height:1.25}.card small{display:block;font-size:12px;line-height:1.4;margin-top:7px;color:#5b5049}.card .go{font-size:12px;font-weight:700;color:#97451f}.card:focus-visible{outline:3px solid #542b1a;outline-offset:-4px}@keyframes slide{to{transform:translateX(calc(-50% - 6px))}}.composer{position:fixed;bottom:0;left:0;right:0;padding:80px 24px 20px;background:linear-gradient(to top,rgba(255,255,255,.78),rgba(255,255,255,.58) 35%,transparent);pointer-events:none}.input{pointer-events:auto;max-width:768px;margin:auto;border:1px solid #fff;border-radius:40px;background:#ffffff80;padding:12px 16px;display:flex;align-items:center;gap:12px}.input input{border:0;background:transparent;outline:0;flex:1;min-width:0;font:inherit}.note{max-width:768px;margin:8px auto 0;font-size:11px;color:#443b36}.status{font-size:12px;color:#673619;margin-top:10px;min-height:18px}@media(max-width:650px){.shell{padding:12px 16px 160px}.header{padding:12px 17px}.actions button{padding:8px;font-size:11px}main{margin-top:60px}.section{margin-top:36px}.card{width:190px}.section-head span{display:none}h1{font-size:36px}}@media(prefers-reduced-motion:reduce){.track{animation:none}.window{overflow-x:auto}}
</style></head><body><div class="shell"><header class="header"><div class="brand"><strong>Disha</strong><span>Career choices, clearly</span></div><div class="actions"><button disabled>Parent summary</button><button type="button" onclick="notice('Evaluation')">Eval</button><button type="button" onclick="notice('Settings')">Settings</button></div></header><main><h1>Explore your next step with clarity.</h1><p>Compare study paths and careers. Find the questions that matter to you.</p><section class="section"><div class="section-head"><h2>Where would you like to start?</h2><span>Choose a topic or ask below</span></div><div class="window"><div class="track" id="track"></div></div><div class="status" id="status" aria-live="polite"></div></section></main></div><div class="composer"><div class="input"><span>＋</span><input placeholder="Ask about streams, careers or colleges…" aria-label="Your question"><button class="ask" onclick="notice('Ask')">Ask →</button></div><div class="note">Session privacy • Audio processed transiently and never stored</div></div><script>
const cards=[['After Class 10','Compare streams and find your fit.'],['After Class 12','Explore degrees and admissions.'],['Explore a career','Understand the work and study path.'],['Colleges & costs','Compare options and total costs.'],['Application checklist','Know the dates and documents.']];const track=document.getElementById('track');[...cards,...cards].forEach(([title,detail],i)=>{const b=document.createElement('button');b.className='card';b.innerHTML=`<div><b>${title}</b><small>${detail}</small></div><span class="go">Explore →</span>`;if(i>=cards.length){b.tabIndex=-1;b.setAttribute('aria-hidden','true')}b.onclick=()=>notice(title);track.appendChild(b)});function notice(text){document.getElementById('status').textContent=`Preview only: ${text} selected.`}
</script></body></html>
